<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Question for you 🎀</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffeef8 0%, #fff0f5 50%, #fdf2f8 100%);
      padding: 20px;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border: 2px solid #ffd1dc;
      border-radius: 28px;
      box-shadow: 0 16px 36px rgba(255, 182, 193, 0.28);
      padding: 44px 36px;
      text-align: center;
      width: 100%;
      max-width: 440px;
      position: relative;
    }

    .bow {
      font-size: 2.2rem;
      margin-bottom: 12px;
      display: block;
    }

    h1 {
      color: #d81b60;
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 10px;
    }

    #subtext {
      color: #ad1457;
      font-size: 0.95rem;
      min-height: 24px;
      font-weight: 500;
      margin-bottom: 30px;
      transition: all 0.2s ease;
    }

    .button-zone {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-height: 70px;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: 600;
      border-radius: 999px;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
      outline: none;
    }

    #yesBtn {
      background: #ff4081;
      color: #ffffff;
      padding: 14px 28px;
      font-size: 1.05rem;
      box-shadow: 0 4px 14px rgba(255, 64, 129, 0.35);
      z-index: 5;
    }

    #yesBtn:hover {
      background: #f50057;
    }

    #noBtn {
      background: #f8bbd0;
      color: #880e4f;
      padding: 14px 24px;
      font-size: 0.95rem;
      position: relative;
      z-index: 2;
    }

    /* When Yes gets big enough to take over the whole button zone */
    #yesBtn.covers-all {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      transform: none !important;
      font-size: 1.3rem !important;
      border-radius: 18px;
      z-index: 10;
    }

    .success-box {
      display: none;
    }

    .success-box h2 {
      color: #d81b60;
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .success-box p {
      color: #6a1b4d;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="askingView">
      <span class="bow">🎀</span>
      <h1>Will you come with me to Magnolia today?</h1>
      <p id="subtext">Say yes please ✨</p>

      <div class="button-zone" id="btnZone">
        <button id="yesBtn">Yes 💖</button>
        <button id="noBtn">No</button>
      </div>
    </div>

    <div class="success-box" id="successView">
      <span class="bow">✨🌸🎀</span>
      <h2>YAY! It's a date!</h2>
      <p>See you at Magnolia today 💕</p>
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const subtext = document.getElementById('subtext');
    const askingView = document.getElementById('askingView');
    const successView = document.getElementById('successView');

    const phrases = [
      "Are you sure? 🥺",
      "Please reconsider...",
      "Think about it again!",
      "You're breaking my heart 💔",
      "Wrong answer, try again 🎀",
      "There's literally only one option left!"
    ];

    let noClickCount = 0;
    const maxClicks = 5;

    noBtn.addEventListener('click', () => {
      noClickCount++;

      // Update text prompt
      const phraseIndex = Math.min(noClickCount - 1, phrases.length - 1);
      subtext.textContent = phrases[phraseIndex];

      if (noClickCount >= maxClicks) {
        // Yes button covers everything
        yesBtn.classList.add('covers-all');
        noBtn.style.display = 'none';
      } else {
        // Incrementally swell Yes button
        const scale = 1 + (noClickCount * 0.35);
        yesBtn.style.transform = `scale(${scale})`;
      }
    });

    yesBtn.addEventListener('click', () => {
      askingView.style.display = 'none';
      successView.style.display = 'block';
    });
  </script>
</body>
  </html>
